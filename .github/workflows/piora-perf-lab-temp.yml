name: Temporary Piora packaged performance lab

on:
  push:
    branches: [codex/piora-performance-lab-20261125]

permissions:
  contents: read
  actions: read

jobs:
  packaged-lab:
    name: Packaged performance (${{ matrix.variant }})
    runs-on: windows-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        variant: [pure, instrumented]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 6
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24.5.0
          package-manager-cache: false
      - name: Fetch exact previously verified release artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          github-token: ${{ github.token }}
          repository: kexijiang/pi-desktop
          run-id: 45574358646
          name: installer-benchmark-after-1
          path: ${{ runner.temp }}/piora-perf-installer
      - name: Install only harness dependencies from lock
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Measure released Electron application
        shell: pwsh
        run: ./scripts/performance-lab/run-lab.ps1
        env:
          PIORA_PERF_LAB_VARIANT: ${{ matrix.variant }}
      - name: Save compact diagnostic results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: packaged-perf-summary-${{ matrix.variant }}-${{ github.run_attempt }}
          path: .verification/lab-summary/**
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 7
      - name: Save raw synthetic measurements
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: packaged-perf-evidence-${{ matrix.variant }}-${{ github.run_attempt }}
          path: .verification/lab-raw/**
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 7
