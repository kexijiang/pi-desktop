name: Published Windows upgrade and existing long conversation

on:
  workflow_dispatch:
    inputs:
      baseline_tag:
        description: Published older Piora beta installation
        type: string
        default: v0.5.11-beta.21
      new_tag:
        description: Published Piora beta installer to test
        type: string
        default: v0.5.11-beta.22

permissions:
  contents: read

jobs:
  upgrade:
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 22.19.0
      - name: Install test harness dependencies
        uses: ./.github/actions/install-ci-dependencies
      - name: Verify published installers and exercise native upgrade dialogs
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          PIORA_QA_BASELINE: ${{ inputs.baseline_tag }}
          PIORA_QA_TARGET: ${{ inputs.new_tag }}
        run: ./scripts/installed-upgrade-acceptance.ps1
      - name: Re-run subagents on the upgraded installation
        if: inputs.new_tag != 'v0.5.11-beta.19'
        shell: pwsh
        run: |
          $exe = Join-Path $env:RUNNER_TEMP 'piora-installed-upgrade/install/Piora.exe'
          node scripts/run-desktop-e2e.mjs --scenario subagents --executable "$exe" --timeout-ms 900000 --step-timeout-ms 180000
      - name: Preserve installation and desktop test evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: windows-installed-upgrade-${{ github.run_attempt }}
          include-hidden-files: true
          path: |
            .verification/nsis-upgrade/
            .verification/desktop-e2e-*/report.md
            .verification/desktop-e2e-*/result.json
            .verification/desktop-e2e-*/subagent-*.png
