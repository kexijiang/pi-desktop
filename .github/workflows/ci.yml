name: Published beta Windows desktop acceptance

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  installed-desktop:
    name: Published Windows installer / ${{ matrix.suite }}
    runs-on: windows-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - suite: chat and workspace
            scenarios: worktree-chat-layout chat-history-pagination browser-settings
          - suite: desktop extensions
            scenarios: cordis-community cordis-extensions desktop-extensions
    env:
      QA_TAG: v0.5.11-beta.22
    steps:
      - name: Check out the exact published test harness
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: v0.5.11-beta.22
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 22.19.0
          package-manager-cache: false
      - uses: ./.github/actions/install-ci-dependencies
      - name: Download all published assets and verify the SHA-256 digests and notes
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $dir = New-Item -ItemType Directory -Path (Join-Path $env:RUNNER_TEMP 'beta-release')
          $release = gh release view $env:QA_TAG --repo $env:GITHUB_REPOSITORY --json tagName,isPrerelease,isDraft,body,assets | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0 -or $release.tagName -ne $env:QA_TAG -or $release.isDraft -or !$release.isPrerelease) { throw 'Expected a published beta' }
          $installer = "Piora-$($env:QA_TAG.Substring(1))-win-x64-setup.exe"
          $names = @('beta.yml', 'SHA256SUMS.txt', $installer, "$installer.blockmap")
          if (Compare-Object ($names | Sort-Object) ($release.assets.name | Sort-Object)) { throw 'Unexpected release assets' }
          gh release download $env:QA_TAG --repo $env:GITHUB_REPOSITORY --dir $dir.FullName
          if ($LASTEXITCODE -ne 0) { throw 'Release download failed' }
          foreach ($asset in $release.assets) {
            $file = Get-Item -LiteralPath (Join-Path $dir $asset.name)
            $sum = (Get-FileHash -Algorithm SHA256 -LiteralPath $file.FullName).Hash.ToLowerInvariant()
            if ($asset.digest -ne "sha256:$sum" -or $asset.size -ne $file.Length) { throw "Release digest mismatch for $($asset.name)" }
            if ($asset.name -ne 'SHA256SUMS.txt') {
              $entry = '^' + $sum + '\s+\*?' + [regex]::Escape($asset.name) + '\s*$'
              if (!(Select-String -LiteralPath (Join-Path $dir 'SHA256SUMS.txt') -Pattern $entry -Quiet)) { throw "Checksum manifest mismatch for $($asset.name)" }
            }
          }
          node scripts/create-release-notes.mjs $env:QA_TAG (Join-Path $dir 'expected.md')
          if ($LASTEXITCODE -ne 0) { throw 'Could not derive version notes' }
          $expected = (Get-Content -Raw -LiteralPath (Join-Path $dir 'expected.md')).Replace([string][char]13, '').Trim()
          if ($release.body.Replace([string][char]13, '').Trim() -cne $expected) { throw 'Published notes differ from CHANGELOG.md' }
      - name: Install and verify the public Windows binary and updater metadata
        shell: pwsh
        run: |
          $dir = Join-Path $env:RUNNER_TEMP 'beta-release'
          $version = $env:QA_TAG.Substring(1)
          $target = Join-Path $dir 'win-unpacked'
          $setup = Join-Path $dir "Piora-$version-win-x64-setup.exe"
          $process = Start-Process -FilePath $setup -ArgumentList "/S /D=$target" -WindowStyle Hidden -Wait -PassThru
          if ($process.ExitCode -ne 0 -or (Get-Item -LiteralPath (Join-Path $target 'Piora.exe')).VersionInfo.FileVersion -ne $version) { throw 'Installation version mismatch' }
          node scripts/verify-windows-update-artifacts.mjs $dir $env:QA_TAG
          if ($LASTEXITCODE -ne 0) { throw 'Installed runtime or updater metadata validation failed' }
      - name: Exercise the installed application with isolated profiles
        shell: pwsh
        env:
          SCENARIOS: ${{ matrix.scenarios }}
          PIORA_DESKTOP_E2E_CORDIS_DISCOVERY: '1'
        run: |
          $exe = Join-Path $env:RUNNER_TEMP 'beta-release/win-unpacked/Piora.exe'
          $failed = @()
          foreach ($scenario in $env:SCENARIOS.Split(' ')) {
            node scripts/run-desktop-e2e.mjs --scenario $scenario --executable $exe --step-timeout-ms 345000 --timeout-ms 900000
            if ($LASTEXITCODE -ne 0) { $failed += $scenario }
          }
          if ($failed.Count) { throw "Failed desktop scenarios: $($failed -join ', ')" }
      - name: Preserve scenario reports and screenshots
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: published-beta-${{ strategy.job-index }}-${{ github.run_attempt }}
          include-hidden-files: true
          path: |
            .verification/desktop-e2e-*/result.json
            .verification/desktop-e2e-*/report.md
            .verification/desktop-e2e-*/*.png
            .verification/desktop-e2e-*/desktop.log
