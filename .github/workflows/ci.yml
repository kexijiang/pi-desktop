name: Windows Cordis and browser settings acceptance

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  packaged-ui:
    name: Exercise Windows packaged application
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 22.19.0
          package-manager-cache: false
      - uses: ./.github/actions/install-ci-dependencies
      - name: Prepare verified Electron
        run: node scripts/prepare-electron-download.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Build Windows unpacked application from the reviewed source
        id: pack
        run: npm run pack:win
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Browser settings in light and dark layouts
        run: node scripts/run-desktop-e2e.mjs --scenario browser-settings --executable desktop/release/win-unpacked/Piora.exe --timeout-ms 720000 --step-timeout-ms 120000
      - name: Cordis directory, native panel, update and data migration
        if: ${{ !cancelled() && steps.pack.outcome == 'success' }}
        env:
          PIORA_DESKTOP_E2E_CORDIS_DISCOVERY: '1'
        run: node scripts/run-desktop-e2e.mjs --scenario cordis-extensions --executable desktop/release/win-unpacked/Piora.exe --timeout-ms 720000 --step-timeout-ms 120000
      - name: Dedicated Pet and Meme adapters
        if: ${{ !cancelled() && steps.pack.outcome == 'success' }}
        run: node scripts/run-desktop-e2e.mjs --scenario desktop-extensions --executable desktop/release/win-unpacked/Piora.exe --timeout-ms 720000 --step-timeout-ms 120000
      - name: Save acceptance evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: windows-cordis-ui-${{ github.run_attempt }}
          include-hidden-files: true
          if-no-files-found: warn
          path: |
            .verification/desktop-e2e-*/result.json
            .verification/desktop-e2e-*/report.md
            .verification/desktop-e2e-*/desktop.log
            .verification/desktop-e2e-*/*.png

  upstream-pet:
    name: Real upstream DSH Pet
    runs-on: windows-latest
    timeout-minutes: 32
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 22.19.0
          package-manager-cache: false
      - uses: ./.github/actions/install-ci-dependencies
      - name: Install and exercise the pinned upstream application
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path .verification -Force | Out-Null
          node scripts/verify-dsh-pet.mjs 2>&1 | Tee-Object -FilePath .verification/upstream-pet.log
          exit $LASTEXITCODE
      - name: Save Pet smoke log
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: upstream-pet-${{ github.run_attempt }}
          include-hidden-files: true
          path: .verification/upstream-pet.log

  upstream-meme:
    name: Real upstream DSH Meme
    runs-on: windows-latest
    timeout-minutes: 32
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 22.19.0
          package-manager-cache: false
      - uses: ./.github/actions/install-ci-dependencies
      - name: Compile desktop test support
        shell: pwsh
        run: |
          npm run build:desktop
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          New-Item -ItemType Directory -Path .verification/meme-desktop -Force | Out-Null
          Copy-Item -Path desktop/dist/* -Destination .verification/meme-desktop -Recurse
      - name: Install and exercise the pinned upstream plugin
        shell: pwsh
        run: |
          node scripts/test-dsh-meme-runtime.mjs 2>&1 | Tee-Object -FilePath .verification/upstream-meme.log
          exit $LASTEXITCODE
      - name: Save Meme smoke evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: upstream-meme-${{ github.run_attempt }}
          include-hidden-files: true
          path: |
            .verification/upstream-meme.log
            .verification/dsh-meme-panel.png
