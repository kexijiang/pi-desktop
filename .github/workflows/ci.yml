name: CI

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  community-acceptance:
    name: Packaged Windows community extension acceptance
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        id: node-setup
        with:
          node-version: 22.19.0
          package-manager-cache: false
      - uses: ./.github/actions/install-ci-dependencies
      - name: Prepare verified Electron
        run: node scripts/prepare-electron-download.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Build the unpacked Windows application
        run: npm run pack:win
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Community installs, updates and failed updates
        run: node scripts/run-desktop-e2e.mjs --scenario cordis-community --executable desktop/release/win-unpacked/Piora.exe --step-timeout-ms 90000 --timeout-ms 600000
      - name: Existing desktop extension regressions
        if: always()
        shell: pwsh
        run: |
          if (!(Test-Path desktop/release/win-unpacked/Piora.exe)) { throw "Packaged application is missing" }
          $env:PIORA_DESKTOP_E2E_CORDIS_DISCOVERY = '1'
          foreach ($scenario in @('cordis-extensions', 'desktop-extensions')) {
            node scripts/run-desktop-e2e.mjs --scenario $scenario --executable desktop/release/win-unpacked/Piora.exe --step-timeout-ms 90000 --timeout-ms 360000
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
      - name: Upload acceptance proofs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: community-windows-acceptance
          path: |
            .verification/desktop-e2e-*/result.json
            .verification/desktop-e2e-*/report.md
            .verification/desktop-e2e-*/desktop.log
            .verification/desktop-e2e-*/*.png
          include-hidden-files: true
          if-no-files-found: warn
